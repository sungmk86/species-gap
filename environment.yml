# Shared conda environment for local analysis (R).
# Recreate with: mamba env create -f environment.yml
# Then: mamba activate species-gap
# Do not put passwords here. AACT credentials go in .Renviron (not shared).

name: species-gap
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.5.3
  - r-dbi=1.3.0
  - r-rpostgres=1.4.10
  - r-ggplot2=4.0.3
